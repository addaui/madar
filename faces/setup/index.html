<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nu'ah setup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="brand">Nu'ah setup</div>
    <label for="name">Profile name</label>
    <input id="name" autocomplete="off" maxlength="60">
    <span class="spacer"></span>
    <span id="path" class="muted"></span>
    <button id="save" class="primary" type="button" disabled>Save profile</button>
  </header>
  <main>
    <section id="problems" aria-live="polite"></section>
    <section id="bindings"></section>
    <section id="plugins"></section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
