<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ebe6df" id="themecolor">
<title>Madar design lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Manrope:wght@400;600;800&family=Nunito:wght@500;700;800&family=Space+Grotesk:wght@400;500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--lab-bg:#121417;--lab-s:#1a1d21;--lab-l:#2a2e34;--lab-t:#e8eaed;--lab-m:#9aa1ab;--lab-a:#7dd3c0}
*{box-sizing:border-box;margin:0}
html{overscroll-behavior:none}
body{font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--lab-bg);color:var(--lab-t);display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh;-webkit-tap-highlight-color:transparent}
button,input,select,textarea,summary{font:inherit;color:inherit;touch-action:manipulation}
.skip{position:absolute;inset-inline-start:8px;inset-block-start:-60px;background:#fff;color:#000;padding:8px 12px;border-radius:6px;z-index:99}
.skip:focus{inset-block-start:8px}

/* ======= lab chrome (not part of the design system) ======= */
.lab{position:sticky;top:0;height:100vh;overflow:auto;overscroll-behavior:contain;background:var(--lab-s);border-inline-end:1px solid var(--lab-l);padding:14px;display:flex;flex-direction:column;gap:12px}
.lab h1{font-size:14px;letter-spacing:.02em}
.lab p.sm{color:var(--lab-m);font-size:12px}
.lab details{border-block-start:1px solid var(--lab-l);padding-block-start:10px}
.lab summary{cursor:pointer;font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--lab-m);padding-block:4px;min-height:24px}
.lab .grid{display:grid;gap:8px;margin-block-start:8px}
.lab label.f{display:grid;grid-template-columns:92px 1fr auto;gap:8px;align-items:center;font-size:12.5px;min-height:28px}
.lab label.f output{color:var(--lab-m);font-variant-numeric:tabular-nums;min-width:2.5ch;text-align:end}
.lab input[type=range]{width:100%;accent-color:var(--lab-a)}
.lab input[type=color]{width:36px;height:26px;border:1px solid var(--lab-l);background:none;padding:0;border-radius:6px}
.lab select{background:var(--lab-bg);border:1px solid var(--lab-l);border-radius:8px;padding:4px 6px;width:100%}
.lab .chips{display:flex;flex-wrap:wrap;gap:6px;margin-block-start:8px}
.lab .chips button,.lab .act{background:var(--lab-bg);border:1px solid var(--lab-l);border-radius:999px;padding:4px 10px;cursor:pointer;min-height:28px}
.lab .chips button:hover,.lab .act:hover{border-color:var(--lab-m)}
.lab .chips button[aria-pressed=true]{background:var(--lab-t);color:#121417;border-color:var(--lab-t)}
.lab .chk{display:flex;align-items:center;gap:8px;min-height:28px;cursor:pointer}
.lab :focus-visible{outline:2px solid var(--lab-a);outline-offset:2px}
.lab .row{display:flex;gap:6px;flex-wrap:wrap}
.lc{display:grid;gap:4px;margin-block-start:8px;font-size:12px;font-variant-numeric:tabular-nums}
.lc div{display:flex;justify-content:space-between;gap:8px}
.lc b.ok{color:#7ddc9a}.lc b.no{color:#ff9b7a}
.out{display:none}.out.on{display:block}
.out textarea{width:100%;height:200px;background:var(--lab-bg);border:1px solid var(--lab-l);border-radius:8px;padding:8px;font:11.5px/1.4 ui-monospace,monospace;color:#cfd3d8}

/* ======= THE DESIGN SYSTEM: everything below reads tokens only ======= */
.stagewrap{min-width:0}
.stage{
  position:relative;min-height:100vh;
  background-color:var(--bg);background-image:var(--tex);background-size:var(--texsize,auto);background-position:top right;background-repeat:var(--texrep,repeat);
  color:var(--text);font:calc(var(--fs)*1px)/1.5 var(--font);
  padding:calc(var(--frame)*1px);
  display:grid;grid-template-columns:var(--sw,232px) minmax(0,1fr) 316px;gap:calc(var(--gap)*1px);align-items:start;
  accent-color:var(--accent);font-variant-numeric:tabular-nums;
  --cpad:calc(10px*var(--d));
  --r-in:max(2px,calc(var(--r)*1px - var(--cpad)));
}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:var(--grain);opacity:var(--grain-o);mix-blend-mode:var(--grain-blend);z-index:5}
.stage h1,.stage h2,.stage h3,.stage .head{font-family:var(--head);font-weight:var(--hw);letter-spacing:var(--hls);text-wrap:balance}
.stage :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage .mono{font-family:ui-monospace,"IBM Plex Mono",monospace}
.surface{background:var(--surf);border:var(--bw) var(--bstyle) var(--bc);border-radius:calc(var(--r)*1px);box-shadow:var(--e2);backdrop-filter:blur(var(--blur)) saturate(1.3);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.3);min-width:0}
.side{background:var(--sidebg);border:var(--bw) var(--bstyle) var(--bc);border-radius:calc(var(--r)*1px);box-shadow:var(--e2);backdrop-filter:blur(var(--blur)) saturate(1.3);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.3);padding:calc(14px*var(--d));display:flex;flex-direction:column;gap:calc(14px*var(--d));position:sticky;inset-block-start:calc(var(--frame)*1px);max-height:calc(100vh - var(--frame)*2px);overflow:auto;overscroll-behavior:contain}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-family:var(--head)}
.logo{inline-size:30px;block-size:30px;border-radius:var(--r-in);background:var(--primary);color:var(--onp);display:grid;place-items:center;flex:none}
.logo svg{inline-size:20px;block-size:20px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;min-block-size:32px;padding:calc(5px*var(--d)) 10px;border-radius:var(--r-in);color:var(--muted);text-decoration:none;transition:background-color .15s,color .15s}
.nav a:hover{background:var(--hover);color:var(--text)}
.nav a[aria-current=page]{background:var(--accent-soft);color:var(--text);font-weight:600}
.nav .n{margin-inline-start:auto;font-size:12px}
.ic{inline-size:16px;block-size:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.label{font-size:11px;letter-spacing:var(--ls);text-transform:var(--tt);color:var(--muted);padding-inline:10px;font-weight:600}
.dot{inline-size:9px;block-size:9px;border-radius:50%;flex:none}
.main{display:flex;flex-direction:column;gap:calc(var(--gap)*1px);min-width:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:calc(12px*var(--d)) calc(16px*var(--d))}
.top h1{font-size:calc(var(--fs)*1.45px)}
.sig-prompt .top h1::before{content:"> ";color:var(--accent)}
.search{margin-inline-start:auto;display:flex;align-items:center;gap:8px;background:var(--sunkc);border:var(--bw) var(--bstyle) var(--bc);border-radius:var(--rbtn);padding:0 12px;min-block-size:34px;color:var(--muted);min-inline-size:190px}
.search input{background:none;border:0;outline:0;color:var(--text);flex:1;min-width:0}
.search:focus-within{outline:2px solid var(--accent);outline-offset:2px}
kbd{display:none;place-items:center;min-inline-size:20px;block-size:20px;padding-inline:5px;font:500 11px/1 ui-monospace,monospace;color:var(--muted);background:var(--surf);border:1px solid var(--bc);border-block-end-width:2px;border-radius:5px}
.sig-keys kbd{display:inline-grid}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-block-size:34px;padding:0 calc(14px*var(--d) + 2px);background:var(--primary);color:var(--onp);border:var(--bw) var(--bstyle) transparent;border-radius:var(--rbtn);font-weight:600;cursor:pointer;box-shadow:var(--eb);transition:background-color .15s,box-shadow .15s,transform .15s,border-color .15s,filter .15s;text-decoration:none}
.btn:hover,.btn.is-hover{filter:brightness(1.12) contrast(1.04)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--surf);color:var(--text);border-color:var(--bc)}
.btn.ghost{background:transparent;color:var(--text);box-shadow:none}
.btn.ghost:hover{background:var(--hover);filter:none}
.btn.danger{background:var(--warn);color:var(--onwarn)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.btn[aria-busy=true]{cursor:progress}
.spin{inline-size:13px;block-size:13px;border:2px solid currentColor;border-inline-end-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:4px;padding:0 calc(16px*var(--d)) calc(10px*var(--d))}
.tabs button{background:none;border:0;padding:0 12px;min-block-size:30px;border-radius:var(--rbtn);color:var(--muted);cursor:pointer;transition:background-color .15s,color .15s}
.tabs button:hover{color:var(--text);background:var(--hover)}
.tabs button[aria-selected=true]{background:var(--text);color:var(--surfc);font-weight:600}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--gap)*1px)}
.col{background:var(--sunkbg);background-image:var(--coltex);border:var(--bw) var(--bstyle) var(--bc);border-radius:calc(var(--r)*1px);padding:var(--cpad);display:flex;flex-direction:column;gap:var(--cpad);backdrop-filter:blur(calc(var(--blur)*.6)) ;-webkit-backdrop-filter:blur(calc(var(--blur)*.6))}
.col header{display:flex;align-items:center;gap:8px;padding:2px 4px;font-weight:700;font-family:var(--head)}
.col header .ct{color:var(--muted);font-weight:500;font-size:12.5px;margin-inline-start:auto}
.sig-ruler .col header::after{content:"";position:absolute}
.ruler{display:none;block-size:7px;margin:0 4px;opacity:.55;background:repeating-linear-gradient(90deg,var(--muted) 0 1px,transparent 1px 8px),repeating-linear-gradient(90deg,var(--muted) 0 1px,transparent 1px 40px);background-size:100% 4px,100% 7px;background-repeat:no-repeat;background-position:0 100%,0 100%}
.sig-ruler .ruler{display:block}
.col ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:var(--cpad)}
.card{appearance:none;text-align:start;inline-size:100%;position:relative;background:var(--surfcard);color:inherit;border:var(--bw) var(--bstyle) var(--bc);border-radius:var(--r-in);padding:calc(12px*var(--d));box-shadow:var(--e1);display:flex;flex-direction:column;gap:calc(8px*var(--d));cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card[aria-pressed=true]{border-color:var(--accent)}
.sig-crop .card[aria-pressed=true]{border-color:transparent}
.sig-crop .card[aria-pressed=true]::before{content:"";position:absolute;inset:-6px;pointer-events:none;
 --g:linear-gradient(var(--accent),var(--accent));
 background:var(--g) 0 0/12px 2px,var(--g) 0 0/2px 12px,var(--g) 100% 0/12px 2px,var(--g) 100% 0/2px 12px,var(--g) 0 100%/12px 2px,var(--g) 0 100%/2px 12px,var(--g) 100% 100%/12px 2px,var(--g) 100% 100%/2px 12px;background-repeat:no-repeat}
.c-top,.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.c-top{color:var(--muted);font-size:12px}
.id{display:none;font-family:ui-monospace,"IBM Plex Mono",monospace;letter-spacing:.02em}
.sig-ids .id{display:inline}
.c-title{font-weight:600;display:block}
.meta{color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:var(--rchip);background:var(--chipbg);color:var(--text);font-size:12px;font-weight:500;min-block-size:20px;white-space:nowrap}
.chip.hot{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warntext)}
.chip.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--oktext)}
.gl{display:none;font-size:.85em;line-height:1}
.sig-glyph .gl{display:inline-block}
.ring{margin-inline-start:auto;display:grid;place-items:center;inline-size:22px;block-size:22px;border-radius:50%;padding:0}
.sig-orbit .ring{inline-size:28px;block-size:28px;padding:3px;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--ringbg) 0)}
.av{inline-size:22px;block-size:22px;border-radius:50%;background:var(--accent);color:var(--onacc);display:grid;place-items:center;font-size:10.5px;font-weight:700}
.pane{padding:calc(16px*var(--d));display:flex;flex-direction:column;gap:calc(14px*var(--d));position:sticky;inset-block-start:calc(var(--frame)*1px)}
.pane h2{font-size:calc(var(--fs)*1.35px);line-height:1.25}
.props{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:calc(8px*var(--d)) 0;border-block-end:var(--bw) var(--bstyle) var(--bc);align-items:center;min-block-size:36px}
.prow>span:first-child{color:var(--muted);font-size:.93em}
.sub{display:flex;flex-direction:column;gap:2px}
.chkrow{display:flex;align-items:center;gap:10px;min-block-size:32px;cursor:pointer}
.chkrow input{inline-size:18px;block-size:18px;flex:none}
.comment{background:var(--sunkc);border-radius:var(--r-in);padding:10px 12px;font-size:.93em}
.page{padding:calc(28px*var(--d)) calc(34px*var(--d));max-inline-size:760px;display:flex;flex-direction:column;gap:14px}
.page h2{font-size:calc(var(--fs)*2.3px);line-height:1.12;scroll-margin-block-start:80px}
.page p{max-inline-size:68ch;text-wrap:pretty}
.page blockquote{border-inline-start:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:var(--r-in)}
.linkcard{display:flex;border:var(--bw) var(--bstyle) var(--bc);border-radius:var(--r-in);overflow:hidden;background:var(--surfcard);text-decoration:none;color:inherit}
.linkcard i{inline-size:104px;background:var(--tex2),var(--accent-soft);flex:none;border-inline-end:var(--bw) var(--bstyle) var(--bc)}
.linkcard div{padding:10px 14px;display:flex;flex-direction:column;gap:2px}
/* system view */
.sys{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:calc(var(--gap)*1px)}
.sys section{padding:calc(16px*var(--d));display:flex;flex-direction:column;gap:12px}
.sys h3{font-size:calc(var(--fs)*1.05px)}
.sys .wide{grid-column:1/-1}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.sw div{border-radius:var(--r-in);border:1px solid var(--bc);overflow:hidden;font-size:11px}
.sw i{display:block;block-size:38px}
.sw span{display:block;padding:4px 6px;background:var(--surfc)}
.rowf{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.elev{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.elev div{block-size:70px;display:grid;place-items:center;background:var(--surfcard);border-radius:var(--r-in);font-size:12px;color:var(--muted)}
.nest{padding:var(--cpad);background:var(--sunkc);border-radius:calc(var(--r)*1px);border:var(--bw) var(--bstyle) var(--bc)}
.nest div{padding:var(--cpad);background:var(--surfcard);border-radius:var(--r-in);border:var(--bw) var(--bstyle) var(--bc);font-size:12px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:.93em}
.field input,.field select,.field textarea{background:var(--surfc);color:var(--text);border:var(--bw) var(--bstyle) var(--bc);border-radius:var(--rbtn);padding:0 12px;min-block-size:36px;font-family:inherit}
.field input[aria-invalid=true]{border-color:var(--warn)}
.field .err{color:var(--warntext);font-size:12.5px}
.field .help{color:var(--muted);font-size:12.5px}
.stage select{background-color:var(--surfc);color:var(--text)}
.sw-btn{inline-size:40px;block-size:24px;border-radius:999px;border:var(--bw) var(--bstyle) var(--bc);background:var(--chipbg);position:relative;cursor:pointer;padding:0;transition:background-color .15s}
.sw-btn::after{content:"";position:absolute;inset-block-start:2px;inset-inline-start:2px;inline-size:18px;block-size:18px;border-radius:50%;background:var(--surfc);box-shadow:var(--e1);transition:transform .15s}
.sw-btn[aria-checked=true]{background:var(--accent)}
.sw-btn[aria-checked=true]::after{transform:translateX(16px)}
[dir=rtl] .sw-btn[aria-checked=true]::after{transform:translateX(-16px)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:18px;border:var(--bw) dashed var(--bc);border-radius:var(--r-in);color:var(--muted)}
.skel{block-size:12px;border-radius:6px;background:linear-gradient(90deg,var(--chipbg),var(--sunkc),var(--chipbg));background-size:200% 100%;animation:sk 1.4s ease-in-out infinite}
@keyframes sk{to{background-position:-200% 0}}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer}
.menu summary::-webkit-details-marker{display:none}
.menu ul{list-style:none;padding:6px;position:absolute;inset-inline-start:0;inset-block-start:calc(100% + 6px);min-inline-size:190px;background:var(--surfc);border:var(--bw) var(--bstyle) var(--bc);border-radius:var(--r-in);box-shadow:var(--e3);z-index:10;display:flex;flex-direction:column}
.menu li button{inline-size:100%;text-align:start;background:none;border:0;padding:0 10px;min-block-size:32px;border-radius:calc(var(--r-in) - 4px);cursor:pointer;display:flex;gap:8px;align-items:center}
.menu li button:hover{background:var(--hover)}
.menu li button .kb{margin-inline-start:auto}
.menu hr{border:0;border-block-start:1px solid var(--bc);margin:4px 2px}
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;inset-block-end:calc(100% + 6px);inset-inline-start:50%;translate:-50% 0;background:var(--text);color:var(--surfc);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s .45s;z-index:20}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1}
dialog{margin:auto;border:var(--bw) var(--bstyle) var(--bc);border-radius:calc(var(--r)*1px);background:var(--surfc);color:var(--text);padding:22px;max-inline-size:min(420px,92vw);box-shadow:var(--e3);font:inherit;overscroll-behavior:contain}
dialog::backdrop{background:rgba(10,10,12,.45)}
dialog h3{margin-block-end:6px}
dialog .rowf{margin-block-start:18px;justify-content:flex-end}
.toasts{position:fixed;inset-block-end:18px;inset-inline-end:18px;display:flex;flex-direction:column;gap:8px;z-index:40}
.toast{background:var(--text);color:var(--surfc);padding:10px 14px;border-radius:var(--r-in);box-shadow:var(--e3);display:flex;gap:14px;align-items:center}
.toast button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;min-block-size:24px}
.scale div{display:flex;align-items:baseline;gap:12px;border-block-end:1px solid var(--bc);padding-block:4px}
.scale small{color:var(--muted);inline-size:90px;flex:none;font-size:11px}
/* ---- refinement ideas (each toggled by a sig-r_* class) ---- */
.qa,.addslot,.ptabs,.pact,.pfil{display:none}
.col ul li{position:relative}
.sig-r_tier .col{box-shadow:inset 0 2px 12px rgba(0,0,0,.22);background:color-mix(in srgb,var(--sunkbg) 100%,transparent)}
.sig-r_tier .card{background:color-mix(in srgb,var(--surfc) 90%,var(--text) 10%);box-shadow:var(--e1),inset 0 1px 0 rgba(255,255,255,.08)}
.sig-r_rail .card::after{content:"";position:absolute;inset-block:9px;inset-inline-start:0;inline-size:3px;border-radius:3px;background:var(--accent);opacity:0;transition:opacity .15s}
.sig-r_rail .card[aria-pressed=true]{border-color:var(--bc);background:linear-gradient(to right,var(--accent-soft),transparent 60%),color-mix(in srgb,var(--surfc) 90%,var(--text) 10%)}
[dir=rtl] .sig-r_rail .card[aria-pressed=true]{background:linear-gradient(to left,var(--accent-soft),transparent 60%),color-mix(in srgb,var(--surfc) 90%,var(--text) 10%)}
.sig-r_rail .card[aria-pressed=true]::after{opacity:1}
.sig-r_rail .card:hover{border-color:var(--bc)}
.due.soon{color:var(--warntext)}
.due.late{color:var(--warntext);font-weight:600;background:color-mix(in srgb,var(--warn) 18%,transparent);padding:0 7px;border-radius:var(--rchip)}
.sig-r_mono .id,.sig-r_mono time,.sig-r_mono .ct,.sig-r_mono .prow time{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.92em}
.sig-r_hier .col header{font:600 11px/1 var(--font);letter-spacing:var(--ls);text-transform:uppercase;color:var(--muted)}
.sig-r_hier .col header h2{font:inherit;letter-spacing:inherit}
.sig-r_hier .c-title{font-weight:500;font-size:1.06em;line-height:1.35}

<aside class="lab" aria-label="Design tokens">
  <div><h1>Madar design lab</h1><p class="sm">One theme = one set of tokens. Pick a preset, then bend any token. State lives in the URL, so a link shares your exact look.</p></div>
  <div><div class="label" style="font-size:12px;color:var(--lab-m);font-weight:600;letter-spacing:.06em;text-transform:uppercase">Presets <span style="opacity:.6;text-transform:none;letter-spacing:0">(keys 1–9)</span></div><div class="chips" id="presets"></div></div>
  <details open><summary>Mode, language, view</summary><div class="grid">
    <div class="chips" id="mode"><button data-v="light">Light</button><button data-v="dark">Dark</button></div>
    <div class="chips" id="dir"><button data-v="ltr">LTR</button><button data-v="rtl">RTL · عربي</button></div>
    <div class="chips" id="view"><button data-v="board">Board</button><button data-v="page">Page</button><button data-v="system">System</button></div>
  </div></details>
  <details open><summary>Colour</summary><div class="grid">
    <label class="f">Primary<input type="color" id="c-primary"><span></span></label>
    <label class="f">Accent<input type="color" id="c-accent"><span></span></label>
    <label class="f">Background<input type="color" id="c-bg"><span></span></label>
    <label class="f">Ink<input type="color" id="c-text"><span></span></label>
    <div class="lc" id="contrast" aria-live="polite"></div>
  </div></details>
  <details open><summary>Material &amp; shape</summary><div class="grid">
    <label class="f">Material<select id="material"><option value="flat">Flat</option><option value="hairline">Hairline</option><option value="clay">Clay</option><option value="glass">Glass</option><option value="elite">Elite (layered)</option><option value="brutal">Brutal (hard shadow)</option><option value="terminal">Terminal (dashed)</option></select><span></span></label>
    <label class="f">Surface radius<input type="range" id="r" min="0" max="40"><output id="r-o"></output></label>
    <label class="f">Card radius<input type="range" id="rcard" min="0" max="40"><output id="rcard-o"></output></label>
    <label class="chk" style="padding-inline-start:4px"><input type="checkbox" id="cauto">Cards follow surface (concentric)</label>
    <label class="f">Control radius<input type="range" id="rbtn" min="0" max="40"><output id="rbtn-o"></output></label>
    <label class="f">Chip radius<input type="range" id="rchip" min="0" max="40"><output id="rchip-o"></output></label>
    <label class="chk" style="padding-inline-start:4px"><input type="checkbox" id="chauto">Chips follow controls</label>
    <label class="f">Border<input type="range" id="bw" min="0" max="4" step=".5"><output id="bw-o"></output></label>
    <label class="f">Shadow<input type="range" id="depth" min="0" max="100"><output id="depth-o"></output></label>
    <label class="f">Glass blur<input type="range" id="blur" min="0" max="30"><output id="blur-o"></output></label>
    <label class="f">Glass alpha<input type="range" id="alpha" min="30" max="100"><output id="alpha-o"></output></label>
  </div></details>
  <details open><summary>Space</summary><div class="grid">
    <label class="f">Density<input type="range" id="d" min="70" max="130"><output id="d-o"></output></label>
    <label class="f">Section gap<input type="range" id="gap" min="0" max="28"><output id="gap-o"></output></label>
    <label class="f">Frame<input type="range" id="frame" min="0" max="32"><output id="frame-o"></output></label>
    <label class="f">Text size<input type="range" id="fs" min="12" max="17"><output id="fs-o"></output></label>
  </div></details>
  <details open><summary>Type</summary><div class="grid">
    <label class="f">Body<select id="font"></select><span></span></label>
    <label class="f">Headings<select id="head"></select><span></span></label>
    <label class="f">Weight<input type="range" id="hw" min="400" max="800" step="50"><output id="hw-o"></output></label>
    <label class="f">Labels<select id="tt"><option value="none">As written</option><option value="uppercase">UPPERCASE</option></select><span></span></label>
  </div></details>
  <details open><summary>Texture</summary><div class="grid">
    <label class="f">Backdrop<select id="texture"><option value="none">None</option><option value="grain">Paper grain</option><option value="dots">Dot grid</option><option value="grid">Line grid</option><option value="orbit">Orbit rings</option></select><span></span></label>
  </div></details>
  <details open><summary>Signature elements &amp; ideas</summary><div class="grid" id="sigs"></div></details>
  <div class="row"><button class="act" id="reset">Reset tweaks</button><button class="act" id="copy">Copy link</button><button class="act" id="export">Export tokens</button></div>
  <div class="out" id="out"><textarea id="json" readonly aria-label="Exported tokens"></textarea></div>
</aside>

/* ---------- theme resolution ---------- */
function theme(){
  const P=PRESETS[st.p],o=st.o,dark=st.mode==='dark',m=st.mode;
  const g=k=>o[k]!==undefined?o[k]:P[k];
  const c=k=>o[m+':'+k]!==undefined?o[m+':'+k]:P[m][k];
  const pal={...P[m]};
  pal.primary=c('primary');pal.accent=c('accent');pal.text=c('text');
  if(o[m+':bg']){const b=o[m+':bg'];pal.bg=b;
    pal.surface=dark?mix(b,'#ffffff',.07):mix(b,'#ffffff',.8);pal.side=dark?mix(b,'#ffffff',.03):mix(b,'#ffffff',.55);

  ${S('Status without colour alone',`<div class="rowf"><span class="chip"><span class="gl" style="display:inline">○</span>${t.cols[0]}</span><span class="chip"><span class="gl" style="display:inline">◐</span>${t.cols[1]}</span><span class="chip ok"><span class="gl" style="display:inline">●</span>${t.cols[2]}</span><span class="chip hot"><span class="gl" style="display:inline">▲</span>${t.prio[0]}</span></div>
    <div class="rowf">${[0,35,70,100].map(p=>`<span class="ring" style="--p:${p};margin:0;inline-size:28px;block-size:28px;padding:3px;background:conic-gradient(var(--accent) ${p}%,var(--ringbg) 0)"><span class="av">M</span></span>`).join('')}<span class="meta">Orbit ring = subtask progress</span></div>
    <div class="rowf"><kbd style="display:inline-grid">N</kbd><kbd style="display:inline-grid">/</kbd><kbd style="display:inline-grid">?</kbd><span class="meta">Keys are shown, never hidden</span></div>`)}
  ${S('Overlays & feedback',`<div class="rowf"><details class="menu"><summary class="btn sec">Task actions…</summary><ul><li><button>${ico('pages')}Open page</button></li><li><button>Move to…<span class="kb"><kbd style="display:inline-grid">M</kbd></span></button></li><hr><li><button style="color:var(--warntext)">Delete…</button></li></ul></details>
    <button class="btn sec" data-act="dlg">Confirm dialog</button><button class="btn sec" data-act="toast">Toast with undo</button><button class="btn ghost" data-tip="Shortcut: N · delay on first only">Tooltip</button></div>
    <div class="empty"><b>No tasks yet</b><span>Press <kbd style="display:inline-grid">N</kbd> to add the first one.</span><button class="btn sec">+ ${t.add}</button></div>
    <div style="display:grid;gap:8px"><div class="skel" style="inline-size:70%"></div><div class="skel"></div><div class="skel" style="inline-size:45%"></div></div>`,'wide')}
  </div>
  <dialog id="dlg" aria-labelledby="dh"><h3 id="dh">Delete this page?</h3><p class="meta" style="font-size:1em">The 3 files only it used will be deleted too. This can’t be undone.</p><form method="dialog" class="rowf"><button class="btn sec" value="x">Cancel</button><button class="btn danger" value="ok">Delete Page</button></form></dialog>`;
}

/* ---------- controls ---------- */
const g=()=>theme().g;
function sync(){
  const{g,P,pal,sig}=theme(),m=st.mode,o=st.o;
  document.querySelectorAll('#presets button').forEach((b,i)=>b.setAttribute('aria-pressed',i===st.p));
  ['mode','dir','view'].forEach(k=>document.querySelectorAll('#'+k+' button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===st[k])));
  $('#c-primary').value=pal.primary;$('#c-accent').value=pal.accent;$('#c-bg').value=pal.bg;$('#c-text').value=pal.text;
  $('#material').value=g('material');
  [['r','r'],['bw','bw'],['depth','depth'],['blur','blur'],['alpha','alpha'],['gap','gap'],['frame','frame'],['fs','fs'],['hw','hw']].forEach(([id,k])=>{$('#'+id).value=g(k);$('#'+id+'-o').textContent=g(k)});
  const R=radii();[['r','r'],['rcard','card'],['rbtn','btn'],['rchip','chip']].forEach(([id,k])=>{const v=Math.min(R[k],40);$('#'+id).value=v;$('#'+id+'-o').textContent=v>=40?'pill':v});
  $('#cauto').checked=g('rcard')==='auto';$('#chauto').checked=g('rchip')==='auto';$('#rcard').disabled=$('#cauto').checked;$('#rchip').disabled=$('#chauto').checked;
  $('#d').value=o.dpct!==undefined?o.dpct:100;$('#d-o').textContent=Math.round(g('d')*(o.dpct!==undefined?o.dpct:100))/100;
  $('#font').value=g('font');$('#head').value=g('head');$('#tt').value=g('tt');$('#texture').value=g('texture');
  document.querySelectorAll('#sigs input').forEach(i=>i.checked=!!sig[i.dataset.k]);
  const want=g('material')==='glass';['blur','alpha'].forEach(id=>$('#'+id).disabled=!want);
  const rows=[['Body text',pal.text,pal.surface,75],['Muted text',pal.muted,pal.surface,60],['Primary button',pal.onp,pal.primary,60],['Accent on surface',pal.accent,pal.surface,45]];
  $('#contrast').innerHTML='<div style="color:var(--lab-m)"><span>APCA Lc (higher is better)</span><span>target</span></div>'+rows.map(([n,a,b,t])=>{const lc=Math.round(apca(a,b));return`<div><span>${n}</span><span><b class="${lc>=t?'ok':'no'}">${lc}</b> / ${t}</span></div>`}).join('');
  $('#json').value=JSON.stringify({preset:P.name,mode:st.mode,direction:st.dir,overrides:st.o,tokens:tokens()},null,2);
}
function build(){
  $('#presets').innerHTML=PRESETS.map((p,i)=>`<button data-i="${i}" title="${p.sub}">${p.name}</button>`).join('');
  const fo=Object.keys(F).map(k=>`<option value="${k}">${k}</option>`).join('');
  $('#font').innerHTML=fo;$('#head').innerHTML=fo;
  $('#sigs').innerHTML=SIGS.map(([k,l])=>`<label class="chk"><input type="checkbox" data-k="${k}">${l}</label>`).join('');
}
const setO=(k,v)=>{st.o[k]=v;applyTokens()};
function wire(){
  $('#presets').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.p=+b.dataset.i;st.o={};render()};
  ['mode','dir','view'].forEach(k=>$('#'+k).onclick=e=>{const b=e.target.closest('button');if(!b)return;st[k]=b.dataset.v;render()});
  const col=id=>$('#c-'+id).oninput=e=>setO(st.mode+':'+id,e.target.value);['primary','accent','bg','text'].forEach(col);
  $('#material').onchange=e=>setO('material',e.target.value);
  ['r','rcard','rbtn','rchip','bw','depth','blur','alpha','gap','frame','fs','hw'].forEach(id=>$('#'+id).oninput=e=>setO(id,+e.target.value));
  $('#d').oninput=e=>setO('dpct',+e.target.value);
  $('#font').onchange=e=>setO('font',e.target.value);$('#head').onchange=e=>setO('head',e.target.value);
  $('#tt').onchange=e=>setO('tt',e.target.value);$('#texture').onchange=e=>setO('texture',e.target.value);
  $('#sigs').onchange=e=>{const i=e.target.closest('input');if(!i)return;st.o.sig={...(st.o.sig||{}),[i.dataset.k]:i.checked?1:0};applyTokens()};
  $('#cauto').onchange=e=>{if(e.target.checked)delete st.o.rcard;else st.o.rcard=radii().card;applyTokens()};
  $('#chauto').onchange=e=>{if(e.target.checked)delete st.o.rchip;else st.o.rchip=radii().chip;applyTokens()};
  $('#reset').onclick=()=>{st.o={};render()};
  $('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('#copy').textContent='Copied ✓';setTimeout(()=>$('#copy').textContent='Copy link',1200)}catch(e){prompt('Copy this link',location.href)}};
  $('#export').onclick=()=>$('#out').classList.toggle('on');
  /* stage interactions */
  $('#stage').addEventListener('click',e=>{
    const c=e.target.closest('[data-card]');if(c){st.sel=+c.dataset.card;render();return}
    const tb=e.target.closest('button[data-tab]');if(tb){st.tab=tb.dataset.tab;render();return}
    const v=e.target.closest('[data-view]');if(v){st.view=v.dataset.view;render();return}
    const n=e.target.closest('[data-nav]');if(n){e.preventDefault();st.view=['board','board','board','page','board'][+n.dataset.nav];render();return}
    const a=e.target.closest('[data-act]');if(!a)return;
    if(a.dataset.act==='sw')a.setAttribute('aria-checked',a.getAttribute('aria-checked')!=='true');
    if(a.dataset.act==='dlg')$('#stage dialog').showModal();
    if(a.dataset.act==='load'){const l=a.textContent;a.setAttribute('aria-busy','true');a.innerHTML='<span class="spin"></span>'+l;setTimeout(()=>{a.removeAttribute('aria-busy');a.textContent=l},1400)}
    if(a.dataset.act==='toast'){const tt=document.createElement('div');tt.className='toast';tt.innerHTML='<span>Task moved to Done.</span><button>Undo</button>';$('#stage .toasts').append(tt);tt.querySelector('button').onclick=()=>tt.remove();setTimeout(()=>tt.remove(),4000)}
  });
  document.addEventListener('click',e=>document.querySelectorAll('.menu[open]').forEach(m=>{if(!m.contains(e.target))m.removeAttribute('open')}));
  document.addEventListener('keydown',e=>{
    if(e.target.matches('input,select,textarea')||e.metaKey||e.ctrlKey||e.altKey)return;
    if(e.key>='1'&&e.key<='9'){st.p=+e.key-1;st.o={};render()}
    else if(e.key==='d'){st.mode=st.mode==='dark'?'light':'dark';render()}
    else if(e.key==='r'){st.dir=st.dir==='rtl'?'ltr':'rtl';render()}
    else if(e.key==='v'){st.view={board:'page',page:'system',system:'board'}[st.view];render()}
  });
}
build();wire();render();
</script>
</body>
</html>
