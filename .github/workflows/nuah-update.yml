name: nuah-update
# When Nuah publishes a new tag, open a pull request that moves Madar to it. The pull request runs the
# tests (and builds the image on merge), so taking a Nuah update is reviewing one diff of four lines.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [nuah-released]

permissions:
  contents: write
  pull-requests: write

env:
  NUAH_REPO: addaui/nuah
  NUAH_READ_TOKEN: ${{ secrets.NUAH_READ_TOKEN }}
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Let cargo and git fetch Nuah
        run: |
          if [ -n "$NUAH_READ_TOKEN" ]; then git config --global url."https://x-access-token:${NUAH_READ_TOKEN}@github.com/".insteadOf "https://github.com/"; fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Find the newest Nuah tag
        id: tag
        run: |
          latest=$(git ls-remote --tags --refs "https://github.com/${NUAH_REPO}" 'v*' | sed 's|.*refs/tags/||' | sort -V | tail -1)
          current=$(grep -m1 '^nuah-kernel' Cargo.toml | sed 's/.*tag = "\(.*\)".*/\1/')
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "Nuah: pinned $current, newest $latest"
      - name: Move the pin
        if: steps.tag.outputs.latest != '' && steps.tag.outputs.latest != steps.tag.outputs.current
        run: |
          sed -i "s|\(^nuah-[a-z]* = .*tag = \"\)[^\"]*\"|\1${{ steps.tag.outputs.latest }}\"|" Cargo.toml
          cargo update -p nuah-kernel -p nuah-adapters -p nuah-http -p nuah-host
      - uses: peter-evans/create-pull-request@v7
        if: steps.tag.outputs.latest != '' && steps.tag.outputs.latest != steps.tag.outputs.current
        with:
          branch: nuah-${{ steps.tag.outputs.latest }}
          title: "Take Nuah ${{ steps.tag.outputs.latest }}"
          commit-message: "Take Nuah ${{ steps.tag.outputs.latest }} (was ${{ steps.tag.outputs.current }})"
          body: |
            Moves the pinned Nuah tag from `${{ steps.tag.outputs.current }}` to `${{ steps.tag.outputs.latest }}`.
            Release notes: https://github.com/${{ env.NUAH_REPO }}/releases/tag/${{ steps.tag.outputs.latest }}

            Nothing in Madar edits Nuah; if the tests fail here, the fix is a plugin or a Madar change, or a pull request to Nuah.
          token: ${{ secrets.NUAH_UPDATE_TOKEN || github.token }}
