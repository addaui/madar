name: nuah-update
# When Nuah or nuah-plugins publish a new tag, open a pull request that moves the pins. The pull request runs
# the tests; a failure there means the two need matching releases. Needs the repository setting "Allow GitHub
# Actions to create and approve pull requests"; add a token as NUAH_UPDATE_TOKEN so the tests run on the pull request.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [nuah-released]

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Find the newest tags
        id: tags
        run: |
          newest() { git ls-remote --tags --refs "https://github.com/$1" 'v*' | sed 's|.*refs/tags/||' | sort -V | tail -1; }
          pinned() { grep -m1 "^$1 " Cargo.toml | sed 's/.*tag = "\(.*\)".*/\1/'; }
          echo "nuah=$(newest addaui/nuah)" >> "$GITHUB_OUTPUT"
          echo "plugins=$(newest addaui/nuah-plugins)" >> "$GITHUB_OUTPUT"
          echo "nuah_now=$(pinned nuah-kernel)" >> "$GITHUB_OUTPUT"
          echo "plugins_now=$(pinned nuah-prefs)" >> "$GITHUB_OUTPUT"
      - name: Move the pins
        id: move
        run: |
          changed=no
          if [ -n "${{ steps.tags.outputs.nuah }}" ] && [ "${{ steps.tags.outputs.nuah }}" != "${{ steps.tags.outputs.nuah_now }}" ]; then
            sed -E -i "s#(^nuah-(kernel|adapters|http|host|console|setup-web) = .*tag = \")[^\"]*\"#\1${{ steps.tags.outputs.nuah }}\"#" Cargo.toml; changed=yes
          fi
          if [ -n "${{ steps.tags.outputs.plugins }}" ] && [ "${{ steps.tags.outputs.plugins }}" != "${{ steps.tags.outputs.plugins_now }}" ]; then
            sed -E -i "s#(^nuah-(prefs|appearance|metric-prometheus) = .*tag = \")[^\"]*\"#\1${{ steps.tags.outputs.plugins }}\"#" Cargo.toml; changed=yes
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" = yes ]; then cargo update -p nuah-kernel -p nuah-adapters -p nuah-http -p nuah-shell -p nuah-console -p nuah-setup-web -p nuah-prefs -p nuah-appearance -p nuah-metric-prometheus; fi
      - uses: peter-evans/create-pull-request@v7
        if: steps.move.outputs.changed == 'yes'
        with:
          branch: nuah-update
          title: "Take Nuah ${{ steps.tags.outputs.nuah }} and nuah-plugins ${{ steps.tags.outputs.plugins }}"
          commit-message: "Take Nuah ${{ steps.tags.outputs.nuah }} and nuah-plugins ${{ steps.tags.outputs.plugins }}"
          body: |
            Nuah ${{ steps.tags.outputs.nuah_now }} to ${{ steps.tags.outputs.nuah }}, nuah-plugins ${{ steps.tags.outputs.plugins_now }} to ${{ steps.tags.outputs.plugins }}.
            https://github.com/addaui/nuah/releases
          token: ${{ secrets.NUAH_UPDATE_TOKEN || github.token }}
