name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  image:
    # Every push to main (and every release tag) builds the image and pushes it to GHCR; pull requests only build it.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The web app is built here and copied into the image (faces/madar/web-react is build output, not in git). It links packages of
      # nuah-plugins, so that repository is checked out beside this one at the tag Madar pins.
      - uses: actions/checkout@v4
        with:
          path: madar
      - name: Check out nuah-plugins at the pinned tag
        run: |
          tag="$(grep -m1 '^nuah-prefs ' madar/Cargo.toml | sed 's/.*tag = "\(.*\)".*/\1/')"
          git clone --depth 1 --branch "$tag" https://github.com/addaui/nuah-plugins nuah-plugins
          # v0.7.0 tracks a node_modules symlink in packages/font-engine; a clean install needs none
          find nuah-plugins -name node_modules -prune -exec rm -rf {} +
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the web app
        run: |
          (cd nuah-plugins && pnpm install --frozen-lockfile)
          cd madar/web && pnpm install --frozen-lockfile && pnpm build
          test -f ../faces/madar/web-react/index.html
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: madar
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: MADAR_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
