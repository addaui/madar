[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.3.0"
license = "UNLICENSED"
publish = false

# Nu'ah is a dependency, pinned by tag. Madar never edits it; to take an update change this tag (the
# `nuah-update` workflow opens that pull request when a new tag appears).
[workspace.dependencies]
nuah-kernel = { git = "https://github.com/addaui/nuah", tag = "v0.3.0" }
nuah-adapters = { git = "https://github.com/addaui/nuah", tag = "v0.3.0" }
nuah-http = { git = "https://github.com/addaui/nuah", tag = "v0.3.0" }
nuah-host = { git = "https://github.com/addaui/nuah", tag = "v0.3.0" }
