[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.3.0"
license = "Apache-2.0"
publish = false

# Nuah is a dependency, pinned by tag. Madar never edits it; to take an update change this tag (the
# `nuah-update` workflow opens that pull request when a new tag appears).
[workspace.dependencies]
nuah-kernel = { git = "https://github.com/addaui/nuah", tag = "v0.10.0" }
nuah-adapters = { git = "https://github.com/addaui/nuah", tag = "v0.10.0" }
nuah-http = { git = "https://github.com/addaui/nuah", tag = "v0.10.0" }
nuah-shell = { git = "https://github.com/addaui/nuah", tag = "v0.10.0" }
nuah-console = { git = "https://github.com/addaui/nuah", tag = "v0.10.0" }
nuah-setup-web = { git = "https://github.com/addaui/nuah", tag = "v0.10.0" }
nuah-prefs = { git = "https://github.com/addaui/nuah-plugins", tag = "v0.2.0" }
# not released yet: the `layout` token and the Elevated theme; becomes a tag of nuah-plugins when they are released (ADR 0055)
nuah-appearance = { path = "../nuah-plugins/crates/nuah-appearance" }
nuah-metric-prometheus = { git = "https://github.com/addaui/nuah-plugins", tag = "v0.2.0" }
# not released yet: becomes a tag of nuah-plugins when `@nuah/emoji` is released (ADR 0053)
nuah-emoji = { path = "../nuah-plugins/crates/nuah-emoji" }
# not released yet: becomes a tag of nuah-plugins when `@nuah/link-analyzer` is released (ADR 0068)
nuah-link-analyzer = { path = "../nuah-plugins/crates/nuah-link-analyzer" }
# not released yet: becomes a tag of nuah-plugins when `@nuah/gifs` and `@nuah/gifs-giphy` are released (ADR 0072)
nuah-gifs = { path = "../nuah-plugins/crates/nuah-gifs" }
nuah-gifs-giphy = { path = "../nuah-plugins/crates/nuah-gifs-giphy" }

# Not released yet: the manifest's `connect` (ADR 0072) is in the local Nuah, on the branch `plugin-connect-origins`. Remove this when Nuah is tagged
# and the dependencies above move to that tag.
[patch."https://github.com/addaui/nuah"]
nuah-kernel = { path = "../nuah/crates/nuah-kernel" }
nuah-adapters = { path = "../nuah/crates/nuah-adapters" }
nuah-http = { path = "../nuah/crates/nuah-http" }
nuah-shell = { path = "../nuah/crates/nuah-shell" }
nuah-console = { path = "../nuah/crates/nuah-console" }
nuah-setup-web = { path = "../nuah/crates/nuah-setup-web" }
