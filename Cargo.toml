[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.3.0"
license = "Apache-2.0"
publish = false

# Nuah is a dependency, pinned by tag. Madar never edits it; to take an update change this tag (the
# `nuah-update` workflow opens that pull request when a new tag appears).
[workspace.dependencies]
nuah-kernel = { git = "https://github.com/addaui/nuah", tag = "v0.17.0" }
nuah-adapters = { git = "https://github.com/addaui/nuah", tag = "v0.17.0" }
nuah-http = { git = "https://github.com/addaui/nuah", tag = "v0.17.0" }
nuah-shell = { git = "https://github.com/addaui/nuah", tag = "v0.17.0" }
nuah-console = { git = "https://github.com/addaui/nuah", tag = "v0.17.0" }
nuah-setup-web = { git = "https://github.com/addaui/nuah", tag = "v0.17.0" }
nuah-prefs = { git = "https://github.com/addaui/nuah-plugins", tag = "v0.9.1" }
nuah-features = { git = "https://github.com/addaui/nuah-plugins", tag = "v0.9.1" }
nuah-previews = { git = "https://github.com/addaui/nuah-plugins", tag = "v0.9.1" }
nuah-entities = { git = "https://github.com/addaui/nuah-plugins", tag = "v0.9.1" }
nuah-live = { git = "https://github.com/addaui/nuah-plugins", tag = "v0.9.1" }
nuah-appearance = { git = "https://github.com/addaui/nuah-plugins", tag = "v0.9.1" }
nuah-metric-prometheus = { git = "https://github.com/addaui/nuah-plugins", tag = "v0.9.1" }
nuah-emoji = { git = "https://github.com/addaui/nuah-plugins", tag = "v0.9.1" }
nuah-fonts = { git = "https://github.com/addaui/nuah-plugins", tag = "v0.9.1" }
nuah-link-analyzer = { git = "https://github.com/addaui/nuah-plugins", tag = "v0.9.1" }
nuah-gifs = { git = "https://github.com/addaui/nuah-plugins", tag = "v0.9.1" }
nuah-gifs-giphy = { git = "https://github.com/addaui/nuah-plugins", tag = "v0.9.1" }
nuah-editor = { git = "https://github.com/addaui/nuah-plugins", tag = "v0.9.1" }
