[package]
name = "nuah-server"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-stream = "0.3.6"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
nuah-kernel = { version = "0.0.1", path = "../nuah-kernel" }
nuah-madar = { version = "0.0.1", path = "../nuah-madar" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower-http = { version = "0.7.1", features = ["fs"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
nuah-client = { path = "../nuah-client" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net"] }
ureq = { version = "3.5.1", features = ["json"] }
