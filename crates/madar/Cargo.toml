[package]
name = "madar"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "madar"
path = "src/main.rs"

[dependencies]
madar-plugins = { path = "../madar-plugins" }
nuah-shell = { workspace = true }

[dev-dependencies]
axum = "0.8.9"
nuah-adapters = { workspace = true }
nuah-console = { workspace = true }
nuah-http = { workspace = true }
nuah-kernel = { workspace = true }
nuah-setup-web = { workspace = true }
nuah-shell = { workspace = true }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
ureq = { version = "3.5.1", features = ["json"] }
uuid = { version = "1.29.0", features = ["v4"] }
