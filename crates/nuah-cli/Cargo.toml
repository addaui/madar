[package]
name = "nuah-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
nuah-kernel = { path = "../nuah-kernel" }
nuah-madar = { path = "../nuah-madar" }
serde_json = "1.0.154"
ureq = { version = "3.5.1", features = ["json"] }

[dev-dependencies]
axum = "0.8.9"
nuah-adapters = { path = "../nuah-adapters" }
nuah-server = { path = "../nuah-server" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net"] }

[[bin]]
name = "madar"
path = "src/main.rs"
