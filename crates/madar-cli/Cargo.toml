[package]
name = "madar-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
nuah-kernel = { workspace = true }
madar-plugins = { path = "../madar-plugins" }
serde_json = "1.0.154"
ureq = { version = "3.5.1", features = ["json"] }

[dev-dependencies]
axum = "0.8.9"
nuah-adapters = { workspace = true }
nuah-http = { workspace = true }

tokio = { version = "1.54.1", features = ["rt-multi-thread", "net"] }

[[bin]]
name = "madar-cli"
path = "src/main.rs"
