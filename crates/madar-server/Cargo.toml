[package]
name = "madar-server"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "madar_server"
path = "src/lib.rs"

[[bin]]
name = "madar-server"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.23"
madar-core = { path = "../madar-core" }
nuah-adapters = { workspace = true }
nuah-host = { workspace = true }
nuah-http = { workspace = true }
nuah-kernel = { workspace = true }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }

[dev-dependencies]
ureq = { version = "3.5.1", features = ["json"] }
uuid = { version = "1.29.0", features = ["v4"] }
