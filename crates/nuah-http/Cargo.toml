[package]
name = "nuah-http"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-stream = "0.3.6"
axum = "0.8.9"
futures-util = "0.3.34"
nuah-kernel = { path = "../nuah-kernel" }
serde_json = "1.0.154"
tower-http = { version = "0.7.1", features = ["fs"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }

[dev-dependencies]
nuah-adapters = { path = "../nuah-adapters" }
ureq = { version = "3.5.1", features = ["json"] }
